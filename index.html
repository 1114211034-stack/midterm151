<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片輪播</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .carousel-item {
        aspect-ratio: 16 / 9;
      }

      .carousel-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .carousel-title {
        position: absolute;
        z-index: 2;
        bottom: 2.5rem;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 15pt;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 1px 5px #000;
      }
    </style>
</head>
<body>
<main class="container py-4">
  <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="第 1 張"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="第 2 張"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="第 3 張"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3" aria-label="第 4 張"></button>
    </div>
    <div class="carousel-inner rounded-4">
      <div class="carousel-item active">
        <img src="https://jibaofiles.s3.amazonaws.com/5a8cf65b9253ee5e7b554620.jpg" class="d-block carousel-image" alt="輪播圖片 1">
      </div>
      <div class="carousel-item">
        <img src="https://www.fetnet.net/content/dam/fetnet/user_resource/cbu/images/life-circle/topics/2025/02/lanfes_con/LanFes_con-2.jpg" class="d-block carousel-image" alt="輪播圖片 2">
      </div>
      <div class="carousel-item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPIYSfEl11AiM4F8R7ApWjwcV5EwGGsJnVstbEUDNnSlPC57UykUhxQpAI&s=10" class="d-block carousel-image" alt="輪播圖片 3">
      </div>
      <div class="carousel-item">
        <img src="https://www.travel.taipei/content/images/articles/113530/1024x768_articles-image-oqsn3wun20ujcsbdlchyra.jpg" class="d-block carousel-image" alt="輪播圖片 4">
      </div>
    </div>
    <div class="carousel-title">元宵Lantern Festival</div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">上一張</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">下一張</span>
    </button>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
